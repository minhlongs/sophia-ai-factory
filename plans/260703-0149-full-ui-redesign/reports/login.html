<body class="flex flex-col min-h-screen items-center justify-center p-6 antialiased">
<!-- Top Navigation (Shell Rule: Suppressed for login) -->
<!-- Not rendered as per conflict resolution protocol for Transactional pages -->
<main class="flex-grow flex items-center justify-center w-full">
<!-- Auth Container -->
<div class="w-full max-w-[440px] login-card border rounded-[12px] p-8 md:p-10 shadow-2xl transition-all duration-500 hover:shadow-indigo-900/10">
<!-- Top Section -->
<div class="flex flex-col items-center mb-8">
<img alt="Sophia AI Factory" class="h-10 mb-6" src="https://lh3.googleusercontent.com/aida/AP1WRLtqUOSnZ1N-s_mvUVzRETh9N9zNk-YJjLDeDi2wsavxXLew-8VhTcs-tgxERWn5muiFy0JaTBKqmbtmyMnOaoP6i_mPRQxhv4tHWRqXkvyIKpDooZMj_M6Qg5Z9L1yyQKxQAfLa0fPh9bTOL6j1Zt45i2FlnJlqykCKawrVyFC8rx9QyuiiKccX9IjUzCcOmIzc54dwYvxO0ct7wdLc9KI67cTr1MTvBS2AXMeYkUslIXbs2VVe4DBXvyI"/>
<h1 class="text-[24px] font-bold text-white tracking-tight mb-1">Welcome back</h1>
<p class="text-[14px] text-[#A1A1AA]">Sign in to your account</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-5" method="POST">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="text-[13px] font-medium text-[#A1A1AA]" for="email">Email</label>
<div class="relative group">
<input class="input-base w-full h-[44px] px-4 rounded-lg border text-white text-sm focus:ring-2 focus:ring-[#6366F1] focus:border-transparent outline-none transition-all placeholder:text-zinc-600" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="text-[13px] font-medium text-[#A1A1AA]" for="password">Password</label>
<a class="text-[13px] font-medium indigo-accent hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
<div class="relative group">
<input class="input-base w-full h-[44px] px-4 rounded-lg border text-white text-sm focus:ring-2 focus:ring-[#6366F1] focus:border-transparent outline-none transition-all placeholder:text-zinc-600" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-white transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- CTA Button -->
<button class="w-full h-[44px] bg-indigo-accent text-white text-[15px] font-semibold rounded-lg hover:brightness-110 active:scale-[0.98] transition-all shadow-lg shadow-indigo-500/20" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-zinc-800"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-[#18181B] px-3 text-[#71717A] font-medium tracking-wider">or continue with</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-3 mb-8">
<button class="flex items-center justify-center gap-2 h-[44px] rounded-lg border border-zinc-800 bg-transparent hover:bg-zinc-800/50 text-white text-sm font-medium transition-all group">
<svg class="w-4 h-4" viewbox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
</svg></button></div></div></main></body></html>
