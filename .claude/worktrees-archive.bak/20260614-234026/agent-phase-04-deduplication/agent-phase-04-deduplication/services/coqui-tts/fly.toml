app = "sophia-coqui-tts"
primary_region = "sin"
# Multi-region replication: enable additional regions via `fly regions add iad fra` after first deploy.
# Latency-based routing is automatic once 2+ regions have healthy machines.
# See services/README.md for the rollout procedure.

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 10
    soft_limit = 5

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
