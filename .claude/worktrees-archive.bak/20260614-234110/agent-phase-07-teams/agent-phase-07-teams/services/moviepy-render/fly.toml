app = "sophia-moviepy-render"
primary_region = "sin"
# Scale-to-zero stays cheap; add regions only if cold-start dominates p95.
# Add via `fly regions add iad fra`; see services/README.md.

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory_mb = 4096
