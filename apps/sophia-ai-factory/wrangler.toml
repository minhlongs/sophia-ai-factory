# Sophia Video Factory — Cloudflare Workers (OpenNext)
# Deploy: npm run build && npx wrangler deploy
name = "sophia-ai-factory"
main = ".open-next/worker.js"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "sophia-ai-factory-opennext-cache"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "sophia-ai-factory"

[images]
binding = "IMAGES"

[triggers]
# Cron schedule:
# "*/5 * * * *" — every 5 min → /api/cron/uptime-check (self-monitoring + Telegram alert)
# "5 * * * *"  — hourly at :05 → /api/cron/usage-export (usage rollup)
# "0 1 * * *"  — daily 01:00 UTC → /api/cron/dunning (dunning state machine)
# "0 2 * * *"  — daily 02:00 UTC → /api/cron/reminders (subscription reminders)
# "0 3 * * *"  — daily 03:00 UTC → /api/cron/scheduled-campaigns (auto-create recurring campaigns)
# "0 4 * * *"  — daily 04:00 UTC → /api/cron/email-drip (nurture drip on day 1, 3, 7 after signup)
crons = ["*/5 * * * *", "5 * * * *", "0 1 * * *", "0 2 * * *", "0 3 * * *", "0 4 * * *"]

[vars]
# NEXT_PUBLIC_MOCK_AI_SERVICES — set in .dev.vars for local dev only
# Production uses real AI services (BYOK keys from customer)

# === P1-VARS-BEGIN ===
# vars block managed by P1 — phase 1 CI/CD enforcement
# COMMIT_SHA and DEPLOYED_AT are injected as CF Secrets (not vars) via wrangler-set-build-vars.sh
# === P1-VARS-END ===

# === P2-CRONS-BEGIN ===
# P2 appends cron triggers here (error-digest, heartbeat)
# === P2-CRONS-END ===

# === P3-CRONS-BEGIN ===
# P3 appends cron triggers here (weekly-signals-digest)
# === P3-CRONS-END ===

# === P3-KV-BEGIN ===
# P3 appends KV namespace bindings here (EXPERIMENT_KV)
# === P3-KV-END ===
