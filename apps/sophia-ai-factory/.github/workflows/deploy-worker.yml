name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/worker/**'
      - 'wrangler.toml'

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/sophia-ai-factory/package-lock.json'

      - name: Install dependencies
        working-directory: apps/sophia-ai-factory
        run: npm ci

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Type check
        working-directory: apps/sophia-ai-factory
        run: npx tsc --noEmit --project tsconfig.worker.json
        continue-on-error: true

      - name: Deploy to Cloudflare (Production)
        if: github.ref == 'refs/heads/main'
        working-directory: apps/sophia-ai-factory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy \
            --name raas-gateway-worker \
            --env production \
            --auto-alias-on-subdomain \
            --var ENVIRONMENT:production

      - name: Deploy to Cloudflare (Preview)
        if: github.event_name == 'pull_request'
        working-directory: apps/sophia-ai-factory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy \
            --name raas-gateway-worker-preview \
            --env preview \
            --auto-alias-on-subdomain \
            --var ENVIRONMENT:preview

      - name: Health Check
        if: github.ref == 'refs/heads/main'
        run: |
          sleep 10  # Wait for deployment
          curl -f https://raas-gateway-worker.$CLOUDFLARE_SUBDOMAIN.workers.dev/health || exit 1
        env:
          CLOUDFLARE_SUBDOMAIN: ${{ secrets.CLOUDFLARE_SUBDOMAIN }}
