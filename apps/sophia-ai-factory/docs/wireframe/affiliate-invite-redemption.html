<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Invite Acceptance — Sophia AI Factory Wireframe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0d0d11; color: #e8e5f1; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .amber-gradient { background: linear-gradient(135deg, #CA7F16 0%, #E69D2C 100%); }
    .card-glass { background: rgba(18, 18, 23, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="card-glass w-full max-w-lg rounded-3xl p-6 sm:p-8 space-y-6 border border-white/10 shadow-2xl relative overflow-hidden">
    <!-- Ambient Glow Accent -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header & Badge -->
    <div class="text-center space-y-2">
      <div class="inline-flex w-12 h-12 rounded-2xl amber-gradient items-center justify-center font-bold text-black text-2xl shadow-lg shadow-amber-500/20 mb-2">S</div>
      <div class="flex items-center justify-center gap-2">
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          Invite Verified
        </span>
        <span class="text-xs font-mono text-white/40">TOKEN: tok_98a...22f</span>
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">Join the Sophia Partner Network</h1>
      <p class="text-xs text-white/60">Tier 1 RevShare (20%) • Dual-Rail Instant Payouts (VietQR / USDT)</p>
    </div>

    <!-- Partner Details Form -->
    <form class="space-y-4 text-xs">
      <div>
        <label class="block text-white/70 font-medium mb-1.5">Full Name / Organization</label>
        <input type="text" placeholder="e.g. Agency Growth Lab" class="w-full bg-black/40 border border-white/10 rounded-xl px-3.5 py-2.5 text-white placeholder-white/30 focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-white/70 font-medium mb-1.5">Notification Email</label>
        <input type="email" placeholder="partner@growthlab.io" class="w-full bg-black/40 border border-white/10 rounded-xl px-3.5 py-2.5 text-white placeholder-white/30 focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-white/70 font-medium mb-1.5">Primary Traffic Channel</label>
        <select class="w-full bg-black/40 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-amber-500">
          <option>TikTok / Short-form Creator</option>
          <option>YouTube Media Network</option>
          <option>B2B Agency / Performance Marketing</option>
          <option>Community / Newsletter</option>
        </select>
      </div>

      <!-- Preferred Payout Rail Initial Setup -->
      <div>
        <label class="block text-white/70 font-medium mb-1.5">Preferred Settlement Rail</label>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center gap-2 p-3 rounded-xl bg-black/30 border border-amber-500/40 cursor-pointer">
            <input type="radio" name="rail" checked class="text-amber-500">
            <div>
              <div class="font-medium text-white">VietQR</div>
              <div class="text-[10px] text-white/50">VND via NAPAS 247</div>
            </div>
          </label>
          <label class="flex items-center gap-2 p-3 rounded-xl bg-black/30 border border-white/10 cursor-pointer">
            <input type="radio" name="rail" class="text-amber-500">
            <div>
              <div class="font-medium text-white">USDT</div>
              <div class="text-[10px] text-white/50">TRC20 / Web3 Instant</div>
            </div>
          </label>
        </div>
      </div>

      <!-- Terms & Anti-Fraud Notice -->
      <div class="p-3 bg-white/[0.02] border border-white/5 rounded-xl space-y-1.5 text-[11px] text-white/50">
        <div class="flex items-start gap-2">
          <input type="checkbox" id="terms" checked class="mt-0.5 rounded border-white/20 text-amber-500 focus:ring-0">
          <label for="terms" class="cursor-pointer text-white/70">
            I agree to the 14-day rolling chargeback hold policy and zero self-referral rule.
          </label>
        </div>
      </div>

      <!-- Action Button -->
      <button type="button" onclick="alert('Partner registered successfully! Forwarding to Dashboard Portal...')" class="w-full py-3 rounded-xl amber-gradient text-black font-bold text-sm hover:brightness-110 transition shadow-lg shadow-amber-500/20">
        Activate Partner Account & Generate Link
      </button>
    </form>
  </div>
</body>
</html>
