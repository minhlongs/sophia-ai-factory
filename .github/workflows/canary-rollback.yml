name: Canary Rollback

# RED-TEAM #8: Triggered by Better Stack alert webhook (NOT CF Analytics GraphQL polling).
# Better Stack alert rule: error_rate > 1%/5min on canary version
#   → POST to https://api.github.com/repos/longtho638-jpg/sophia-ai-factory/actions/workflows/canary-rollback.yml/dispatches
#   → Authorization: Bearer ${WEBHOOK_SECRET}
# Backoff: max 1 rollback per 30 min (prevents flapping).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Rollback reason (auto: BS alert ID, or manual)'
        required: false
        default: 'manual'
      alert_id:
        description: 'Better Stack alert ID (if auto-triggered)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  rollback:
    name: Auto-rollback — canary to stable
    runs-on: ubuntu-latest

    steps:
      # RED-TEAM #1: SHA-pinned (actions/checkout v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # RED-TEAM #1: prior SHA-pin (1d0ff46…) was invalid → unblocked via tag.
      # Re-pin to a verified v4.x SHA in follow-up.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies (wrangler)
        run: npm install --legacy-peer-deps

      # RED-TEAM #8: 30-min backoff — skip if rollback already ran in last 30 min
      - name: Check rollback backoff (30 min)
        id: backoff
        run: |
          CUTOFF=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                   date -u -v-30M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                   python3 -c "from datetime import datetime, timedelta; print((datetime.utcnow()-timedelta(minutes=30)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          echo "Checking for rollbacks since: $CUTOFF"
          RECENT=$(gh run list \
            --workflow=canary-rollback.yml \
            --status=success \
            --limit=5 \
            --json createdAt \
            --jq "[.[] | select(.createdAt > \"$CUTOFF\")] | length" 2>/dev/null || echo "0")
          echo "Recent rollbacks in last 30min: $RECENT"
          if [ "$RECENT" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "BACKOFF: rollback already ran in last 30min — skipping to prevent flapping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute wrangler rollback
        if: steps.backoff.outputs.skip != 'true'
        run: |
          REASON="${{ github.event.inputs.reason }}"
          ALERT_ID="${{ github.event.inputs.alert_id }}"
          MSG="auto: BS alert ${ALERT_ID:-none} — ${REASON}"
          echo "[rollback] Executing: wrangler rollback — $MSG"
          wrangler rollback --name sophia-ai-factory --message "$MSG" --yes
          echo "[rollback] Rollback complete."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Telegram rollback alert
        if: steps.backoff.outputs.skip != 'true'
        run: |
          REASON="${{ github.event.inputs.reason }}"
          ALERT_ID="${{ github.event.inputs.alert_id }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 *Sophia Canary Rollback*%0A%0AReason: ${REASON}%0AAlert: ${ALERT_ID:-manual}%0ARun: ${RUN_URL}"
          curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" || echo "WARNING: Telegram alert failed"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Skip notice
        if: steps.backoff.outputs.skip == 'true'
        run: echo "Rollback skipped — backoff active (1 per 30 min). Check recent runs."
