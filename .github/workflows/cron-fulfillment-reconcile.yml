name: Fulfillment Reconciliation

on:
  schedule:
    # Daily 06:00 UTC — detect paid purchases with no delivered video.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Trigger fulfillment-reconcile cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          SECRET_VALUE="${CRON_SECRET:-}"
          if [ -z "${SECRET_VALUE//[[:space:]]/}" ]; then
            echo "::error::CRON_SECRET is not configured for production environment." >&2
            exit 1
          fi

          HTTP_STATUS=$(curl -sS \
            --connect-timeout 15 \
            --max-time 120 \
            -o /dev/null \
            -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "https://sophia.agencyos.network/api/cron/fulfillment-reconcile") || {
            echo "::error::fulfillment-reconcile request failed due to transport or timeout error." >&2
            exit 1
          }

          case "$HTTP_STATUS" in
            2[0-9][0-9])
              echo "fulfillment-reconcile succeeded (HTTP ${HTTP_STATUS})."
              ;;
            *)
              echo "::error::fulfillment-reconcile failed with HTTP ${HTTP_STATUS:-unknown}." >&2
              exit 1
              ;;
          esac
