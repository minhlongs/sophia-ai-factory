name: Quality Gate (Gates 1 + 3)

# RED-TEAM #1: pull_request ONLY (never pull_request_target). Secrets withheld from forks.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  gate-1-validation:
    name: Gate 1 — Validation (tsc + eslint + vitest)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: apps/sophia-ai-factory

    steps:
      # RED-TEAM #1: SHA-pinned action (actions/checkout v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # RED-TEAM #1: prior SHA-pin (1d0ff46…) was invalid → unblocked via tag.
      # Re-pin to a verified v4.x SHA in follow-up.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/sophia-ai-factory/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Gate 1a — TypeScript type check
        run: npx tsc --noEmit

      - name: Gate 1b — ESLint
        run: npm run lint

      - name: Gate 1c — Vitest with coverage
        run: npm test -- --coverage --reporter=junit --outputFile=test-results.xml
        env:
          CI: true

      - name: Gate 3a — Coverage threshold >= 70%
        run: |
          python3 -c "
          import json, sys, os
          cov_file = 'coverage/coverage-summary.json'
          if not os.path.exists(cov_file):
            print('WARNING: coverage file not found — skipping threshold check')
            sys.exit(0)
          data = json.load(open(cov_file))
          pct = data.get('total', {}).get('lines', {}).get('pct', 0)
          print(f'Lines coverage: {pct}%')
          if pct < 70:
            print(f'FAIL: {pct}% < 70% threshold')
            sys.exit(1)
          print('PASS')
          "

      - name: Gate 3b — Zero :any types
        run: |
          COUNT=$(grep -rn ': any' src --include="*.ts" --include="*.tsx" 2>/dev/null | wc -l | tr -d ' ')
          echo "':any' occurrences: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            grep -rn ': any' src --include="*.ts" --include="*.tsx" || true
            echo "FAIL: zero ':any' types required"
            exit 1
          fi
          echo "PASS"

      - name: Gate 3c — Zero console.log/warn/error
        run: |
          COUNT=$(grep -rn 'console\.\(log\|warn\|error\)' src --include="*.ts" --include="*.tsx" 2>/dev/null \
            | grep -v '// eslint-disable' | grep -v '__tests__' | wc -l | tr -d ' ')
          echo "console.* calls: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            grep -rn 'console\.\(log\|warn\|error\)' src --include="*.ts" --include="*.tsx" \
              | grep -v '__tests__' || true
            echo "FAIL: use logger utility instead of console.*"
            exit 1
          fi
          echo "PASS"
