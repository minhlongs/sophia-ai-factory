name: Quality Gate (Gates 1 + 3)

# RED-TEAM #1: pull_request ONLY (never pull_request_target). Secrets withheld from forks.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  gate-1-validation:
    name: Gate 1 — Validation (tsc + eslint + boundaries + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sophia-ai-factory

    steps:
      # RED-TEAM #1: SHA-pinned action (actions/checkout v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # RED-TEAM #1: pinned to the verified setup-node v4.4.0 release commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/sophia-ai-factory/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Gate 1a — TypeScript type check
        run: npx tsc --noEmit

      - name: Gate 1b — ESLint
        run: npm run lint

      - name: Gate 1c — Layer Boundary Check
        run: npm run check:boundaries

      - name: Gate 1d — Vitest with coverage
        run: npm test -- --coverage --maxWorkers=2 --reporter=junit --outputFile=test-results.xml
        env:
          CI: true

      - name: Gate 3a — Changed executable lines and branches coverage >= 70%
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-diff-coverage.mjs

      - name: Gate 3b — Production TypeScript source guards
        run: node scripts/check-production-source-guards.mjs

      - name: Gate 3c — Secret Leak Prevention (Public GitHub Hygiene)
        run: |
          LEAKS=$(grep -rnE '(sk-or-v1-[a-f0-9]{48,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' src --include="*.ts" --include="*.tsx" --exclude="*.test.ts" --exclude="*.test.tsx" --exclude-dir="__tests__" 2>/dev/null | wc -l | tr -d ' ')
          echo "Potential live secret leaks: $LEAKS"
          if [ "$LEAKS" -gt 0 ]; then
            echo "FAIL: live credential pattern detected in production source"
            exit 1
          fi
          echo "PASS"
