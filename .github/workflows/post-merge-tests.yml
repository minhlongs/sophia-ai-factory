name: Post-Merge Tests

# RED-TEAM #15: Runs after every push to main.
# Failure blocks ALL subsequent PR merges via branch protection check.
# Branch protection rule (manual GitHub UI): require 'post-merge-tests' check to pass.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  post-merge-tests:
    name: Post-merge verification (blocks next merge on fail)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sophia-ai-factory

    steps:
      # RED-TEAM #1: SHA-pinned (actions/checkout v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # RED-TEAM #1: prior SHA-pin (1d0ff46…) was invalid → unblocked via tag.
      # Re-pin to a verified v4.x SHA in follow-up.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/sophia-ai-factory/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run full test suite
        run: npm test
        env:
          CI: true

      - name: E2E smoke tests
        run: npm run e2e:smoke
        continue-on-error: true
        env:
          CI: true
          PROD_URL: https://sophia.agencyos.network
