# Auto-Deploy CI/CD — Push main → quality gate → wrangler deploy → SHA verify
# Restored and updated from .github/workflows/test.yml.disabled (archived 2026-05-03).
# Replaces the old multi-step deploy (wrangler-action@v3) with a single
# `npm run deploy:full` invocation that wraps deploy-with-sha.sh.
#
# Key differences from the archived workflow:
#   - Uses `npm run deploy:full` instead of separate `deploy:build` + wrangler-action
#   - Adds post-deploy SHA verification against /api/version
#   - SKIP_SYMBOL_UPLOAD=1 set as default env (per no-tech doctrine)
#   - Uses actions/checkout@v4 and actions/setup-node@v4
#   - npm cache enabled for faster installs
#
# GitHub Secrets required:
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token with Workers permissions
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID

name: Auto-Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  SKIP_SYMBOL_UPLOAD: 1

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sophia-ai-factory

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/sophia-ai-factory/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify green pipeline (typecheck + lint + test + build)
        run: npm run verify:green

  deploy:
    name: Deploy to Cloudflare Workers
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sophia-ai-factory

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required by deploy-with-sha.sh for git range checks
          # (previous-live-SHA diff, migration detection, push precondition).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/sophia-ai-factory/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy:full
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed SHA matches commit
        run: |
          LOCAL_SHA=$(git rev-parse HEAD | cut -c1-8)
          LIVE_SHA=$(curl -s https://sophia.agencyos.network/api/version | grep -o '"shortSha":"[^"]*"' | cut -d'"' -f4)
          if [ "$LOCAL_SHA" != "$LIVE_SHA" ]; then
            echo "SHA mismatch: local=$LOCAL_SHA live=$LIVE_SHA"
            exit 1
          fi
          echo "Deploy verified: $LOCAL_SHA"
