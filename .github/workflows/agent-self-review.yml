# Sophia Factory — Agent Self-Review (Benevolent Neglect Loop)
# Strategic pillar #3 from DeepSeek PDF: weekly read agent journal,
# summarize via OpenRouter, post GitHub Issue for founder review.
#
# Per Red Team #14: journal entries already PII-scrubbed before commit.
# This workflow only READS journal + posts Issue. No file writes to repo.

name: Agent Self-Review (Weekly)

on:
  schedule:
    # Monday 08:00 UTC (after weekly-signals-digest at 06:00 UTC)
    - cron: "0 8 * * 1"
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: read
  issues: write

jobs:
  self-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 14 # 2 weeks of history for journal context

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run self-review script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/agent-self-review/summarize.py
