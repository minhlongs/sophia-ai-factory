name: Security Scan (Gate 2)

# RED-TEAM #1: pull_request ONLY. Secrets withheld from forks by default.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate-2-security:
    name: Gate 2 — Security (npm audit + trufflehog + csp-evaluator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sophia-ai-factory

    steps:
      # RED-TEAM #1: SHA-pinned (actions/checkout v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0  # full history for trufflehog

      # RED-TEAM #1: pinned to the verified setup-node v4.4.0 release commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/sophia-ai-factory/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Gate 2a — npm audit (high + critical only)
        run: npm audit --audit-level=high --omit=dev

      - name: Gate 2b — TruffleHog secret scan (PR commit range)
        # Pull request checkouts use detached HEAD; use the fetched remote-tracking base ref.
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: origin/${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
          version: v3.99.2

      - name: Gate 2c — CSP evaluator (no polar.sh, no unsafe-inline)
        run: |
          # Extract CSP from middleware and verify no forbidden directives
          MIDDLEWARE="src/middleware.ts"
          if grep -q "polar\.sh" "$MIDDLEWARE"; then
            echo "FAIL: polar.sh found in CSP — must be removed"
            grep -n "polar\.sh" "$MIDDLEWARE"
            exit 1
          fi
          echo "PASS: no polar.sh in CSP"

          # Check for unsafe-inline in script-src
          if grep -q "unsafe-inline" "$MIDDLEWARE"; then
            echo "WARNING: unsafe-inline found in CSP — review required"
          fi
          echo "PASS: CSP check complete"
