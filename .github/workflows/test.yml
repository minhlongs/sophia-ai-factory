name: Tests

on: [push, pull_request]

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sophia-ai-factory

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Security audit (production deps only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

# Note: Cloudflare Workers deployment is triggered automatically by Cloudflare's
# GitHub integration (Pages/Workers CI) — not managed in this workflow.
