name: 🐛 Bug Report (Community & Cloud)
description: Report a reproducible bug in Sophia AI Factory Open-Core or Managed Cloud
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve **Sophia AI Factory**! For security vulnerabilities, please DO NOT open a public issue — email `security@agencyos.network` per `SECURITY.md`.
  - type: dropdown
    id: edition
    attributes:
      label: Sophia Edition
      options:
        - Community Self-Hosted (Apache-2.0)
        - Sophia Managed Cloud (sophia.agencyos.network)
        - Enterprise / Master Licensed ($4,999)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Minimal steps to reproduce the behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
    validations:
      required: true
