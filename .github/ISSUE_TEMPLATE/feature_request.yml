name: ✨ Feature Request
description: Propose an enhancement for Open-Core Community or Sophia Cloud
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Target Architecture Layer
      options:
        - seed (Foundational primitives / types / security)
        - tree (Reusable domain logic / BYOK / Ask router)
        - forest (Inngest workflows / UI portals / RaaS gateway)
        - land (Commercial billing / affiliates / growth)
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Intended Outcome & Use Case (Bilingual VI/EN welcome)
    validations:
      required: true
